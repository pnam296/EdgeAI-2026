# TRÒ (<= 200k tham số): YOLO11 tự thiết kế cho vật nhỏ, train từ đầu.
# Đầu ra P2/4, P3/8, P4/16 (bỏ P5 -> đầu vào 320x240 chia hết cho 16). Giảm kích thước bằng SCDown
# (pointwise + depthwise, kiểu YOLOv10) thay conv 3x3 để dồn tham số sang P2/P3: kênh P2/P3/P4 = 32/64/64.
# reg_max 4 (DFL nhỏ) cho head box rẻ hơn; bỏ C2PSA (attention) cho vừa trần tham số.
nc: 7
reg_max: 4
scales:
  s: [0.33, 0.25, 256]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, SCDown, [256, 3, 2]]       # 3 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, SCDown, [512, 3, 2]]       # 5 P4/16
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, SPPF, [512, 5]]            # 7
  - [-1, 1, nn.Identity, []]           # 8 (chỗ C2PSA của bản thầy)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 9
  - [[-1, 4], 1, Concat, [1]]                   # 10
  - [-1, 2, C3k2, [256, False]]                 # 11
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 2], 1, Concat, [1]]                   # 13
  - [-1, 2, C3k2, [128, False]]                 # 14 ra P2/4
  - [-1, 1, SCDown, [128, 3, 2]]                # 15
  - [[-1, 11], 1, Concat, [1]]                  # 16
  - [-1, 2, C3k2, [256, False]]                 # 17 ra P3/8
  - [-1, 1, SCDown, [256, 3, 2]]                # 18
  - [[-1, 8], 1, Concat, [1]]                   # 19
  - [-1, 2, C3k2, [512, True]]                  # 20 ra P4/16
  - [[14, 17, 20], 1, Detect, [nc]]             # 21
