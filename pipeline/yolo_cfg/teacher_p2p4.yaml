# THẦY (2,58 triệu tham số, VƯỢT trần, KHÔNG nộp, chỉ để distill), train từ đầu trên dữ liệu BTC.
# Cùng bố cục đầu ra với trò (P2/4, P3/8, P4/16; reg_max 4; 6.300 anchor ở 320x240) để distill từng ô,
# nhưng rộng hơn (depth 0.5, width 0.5), giảm kích thước bằng conv 3x3 thường và có C2PSA.
nc: 7
reg_max: 4
scales:
  s: [0.5, 0.5, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]       # 5 P4/16
  - [-1, 2, C3k2, [512, True]]         # 6
  - [-1, 1, SPPF, [512, 5]]            # 7
  - [-1, 2, C2PSA, [512]]              # 8
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 9
  - [[-1, 4], 1, Concat, [1]]                   # 10
  - [-1, 2, C3k2, [256, False]]                 # 11
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 2], 1, Concat, [1]]                   # 13
  - [-1, 2, C3k2, [128, False]]                 # 14 ra P2/4
  - [-1, 1, Conv, [128, 3, 2]]                # 15
  - [[-1, 11], 1, Concat, [1]]                  # 16
  - [-1, 2, C3k2, [256, False]]                 # 17 ra P3/8
  - [-1, 1, Conv, [256, 3, 2]]                # 18
  - [[-1, 8], 1, Concat, [1]]                   # 19
  - [-1, 2, C3k2, [512, True]]                  # 20 ra P4/16
  - [[14, 17, 20], 1, Detect, [nc]]             # 21
